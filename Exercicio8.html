<!DOCTYPE html>
<html lang="pt-BR" onload="bemVindo()">
<head>
  <meta charset="UTF-8">
  <title>Formulário de Cadastro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    function bemVindo() {
      alert("Bem vindo ao formulário de cadastro!");
    }

    function toUpperCaseField(field) {
      field.value = field.value.toUpperCase();
    }

    function validarFormulario(event) {
      event.preventDefault(); 

      const nome = document.getElementById("nome").value.trim();
      const cpf = document.getElementById("cpf").value.trim();
      const endereco = document.getElementById("endereco").value.trim();
      const ano = parseInt(document.getElementById("ano").value);
      const telefone = document.getElementById("telefone").value.trim();
      const estado = document.getElementById("estado").value.trim();
      const cidade = document.getElementById("cidade").value.trim();
      const senha = document.getElementById("senha").value.trim();
      const confirmaSenha = document.getElementById("confirmaSenha").value.trim();

      if (!nome || !cpf || !endereco || !ano || !telefone || !estado || !cidade || !senha || !confirmaSenha) {
        alert("Todos os campos devem ser preenchidos!");
        return false;
      }

      if (ano < 0 || ano >= 2026) {
        alert("Ano de nascimento inválido!");
        return false;
      }

      if (senha === nome || confirmaSenha === nome) {
        alert("Senha e confirmação não podem ser iguais ao nome!");
        return false;
      }

      if (senha !== confirmaSenha) {
        alert("Senha e confirmação devem ser iguais!");
        return false;
      }

      alert("Formulário enviado com sucesso!");
      return true;
    }
  </script>
</head>
<body class="container mt-5">

  <h1 class="text-center mb-4">Cadastro de Usuário</h1>

  <form onsubmit="validarFormulario(event)" class="border p-4 bg-light rounded">
    <div class="mb-3">
      <label for="nome" class="form-label">Nome:</label>
      <input type="text" id="nome" class="form-control" onchange="toUpperCaseField(this)">
    </div>

    <div class="mb-3">
      <label for="cpf" class="form-label">CPF:</label>
      <input type="text" id="cpf" class="form-control" onchange="toUpperCaseField(this)">
    </div>

    <div class="mb-3">
      <label for="endereco" class="form-label">Endereço:</label>
      <input type="text" id="endereco" class="form-control" onchange="toUpperCaseField(this)">
    </div>

    <div class="mb-3">
      <label for="ano" class="form-label">Ano de Nascimento:</label>
      <input type="number" id="ano" class="form-control">
    </div>

    <div class="mb-3">
      <label for="telefone" class="form-label">Telefone:</label>
      <input type="text" id="telefone" class="form-control" onchange="toUpperCaseField(this)">
    </div>

    <div class="mb-3">
      <label for="estado" class="form-label">Estado:</label>
      <input type="text" id="estado" class="form-control" onchange="toUpperCaseField(this)">
    </div>

    <div class="mb-3">
      <label for="cidade" class="form-label">Cidade:</label>
      <input type="text" id="cidade" class="form-control" onchange="toUpperCaseField(this)">
    </div>

    <div class="mb-3">
      <label for="senha" class="form-label">Senha:</label>
      <input type="password" id="senha" class="form-control">
    </div>

    <div class="mb-3">
      <label for="confirmaSenha" class="form-label">Confirmação de Senha:</label>
      <input type="password" id="confirmaSenha" class="form-control">
    </div>

    <button type="submit" class="btn btn-primary">Enviar</button>
    <button type="reset" class="btn btn-secondary">Resetar</button>
  </form>

</body>
</html>
